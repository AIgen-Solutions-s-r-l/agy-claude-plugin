name: copy-truth
on: [push, pull_request]
jobs:
  grep-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on dead storefront strings
        run: |
          dead='via the /agy command|one markdown command file|Gemini by default|Antigravity with -P'
          if grep -rnE "$dead" . --exclude-dir=.git --exclude=CHANGELOG.md --exclude=copy-truth.yml; then
            echo "::error::Dead storefront copy reappeared (see matches above)."; exit 1
          fi
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan catches the planted fixture (privacy claim is falsifiable)
        run: |
          chmod +x test/secret-scan.sh
          test/secret-scan.sh
